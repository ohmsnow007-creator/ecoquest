# Netlify serves EcoQuest at the site root, so the app is built with BASE_PATH=/.
# GitHub Pages keeps using /ecoquest/ (the default in vite.config.ts).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "22"

# The app uses hash routes (#/home), so every page is index.html; this also covers direct visits.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the service worker and manifest fresh so updates reach installed apps quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Build files have content hashes in their names, so they can be cached for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
